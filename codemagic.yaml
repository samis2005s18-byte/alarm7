workflows:
  testflight:
    name: StepAlarm to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    integrations:
      app_store_connect: StepAlarm key
    environment:
      xcode: latest
      groups:
        - signing # holds CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: "sami.amlar"
    scripts:
      - name: Generate Xcode project
        script: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
      - name: Set up code signing
        script: |
          set -e
          echo "Signing key length: ${#CERTIFICATE_PRIVATE_KEY} characters"
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is empty - re-add it in Environment variables (group: signing)"
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --strict-match-identifier --create
          app-store-connect fetch-signing-files "$BUNDLE_ID.StepAlarmWidget" --type IOS_APP_STORE --strict-match-identifier --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: agvtool new-version -all "$BUILD_NUMBER"
      - name: Build app
        script: xcode-project build-ipa --project StepAlarm.xcodeproj --scheme StepAlarm
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
