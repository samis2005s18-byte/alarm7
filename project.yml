# XcodeGen spec — `xcodegen generate` turns this into StepAlarm.xcodeproj.
# The bundle ID comes from the BUNDLE_ID environment variable (set in codemagic.yaml).
name: StepAlarm
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    APP_BUNDLE_ID: ${BUNDLE_ID}
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  StepAlarm:
    type: application
    platform: iOS
    sources:
      - path: StepAlarm/StepAlarm
        excludes:
          - Info.plist
          - WalkingIcon.png
          - StepAlarm.storekit
          - PrivacyInfo.xcprivacy
          - StepAlarm.entitlements
      - path: StepAlarm/Shared
      - path: StepAlarm/AppLockShared
      - path: StepAlarm/StepAlarm/StepAlarm.storekit
        buildPhase: none
      - path: StepAlarm/StepAlarm/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: StepAlarmWidget
      - target: AppLockMonitor
    settings:
      base:
        PRODUCT_NAME: StepAlarm
        CODE_SIGN_ENTITLEMENTS: StepAlarm/StepAlarm/StepAlarm.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: StepAlarm/StepAlarm/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alarm7
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  StepAlarmWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StepAlarm/StepAlarmWidget
        excludes:
          - Info.plist
      - path: StepAlarm/Shared
    settings:
      base:
        PRODUCT_NAME: StepAlarmWidget
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).StepAlarmWidget
        INFOPLIST_FILE: StepAlarm/StepAlarmWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alarm7
        SKIP_INSTALL: YES
  AppLockMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: StepAlarm/AppLockMonitor
        excludes:
          - Info.plist
          - AppLockMonitor.entitlements
      - path: StepAlarm/AppLockShared
    settings:
      base:
        PRODUCT_NAME: AppLockMonitor
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).AppLockMonitor
        INFOPLIST_FILE: StepAlarm/AppLockMonitor/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Alarm7
        CODE_SIGN_ENTITLEMENTS: StepAlarm/AppLockMonitor/AppLockMonitor.entitlements
        SKIP_INSTALL: YES
schemes:
  StepAlarm:
    build:
      targets:
        StepAlarm: all
    run:
      config: Debug
      storeKitConfiguration: StepAlarm/StepAlarm/StepAlarm.storekit
    archive:
      config: Release
